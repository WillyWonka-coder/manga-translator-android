name: Build Android APK for Tablet

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Download Base AI Models (YOLO & PaddleOCR)
        run: |
          mkdir -p assets/models
          echo "Downloading pre-packaged ONNX models..."
          wget -q https://github.com/jedzqer/manga-translator-android/releases/download/v3.4.8/app-release.apk -O base.apk
          unzip -q -o base.apk "assets/models/*" -d . || true
          rm base.apk

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: manga-translator-tablet-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14